# CarPlay stream-111 SOURCE / negotiation settings, 800x480 variant (VW MU1367 / AID 12.3 candidate).
# Installed as config/carplay/altscreen111.conf by a profile that selects this geometry; the shared
# altscreen111.conf (1010x376) stays the default for every existing profile. Differences from it: the
# size lines and these comments only (modules/carplay/source/altscreen111-gen2/tests/test_geometry_profile_files.py enforces that).
#
# Evidence: SOURCE only. [Unverifiziert] 800x480 is Prior Art (OneB1t baseline, Omonob 791 profile:
# 800x480, maxFPS 40, see docs/research/media/OMONOB_790_791_ARTIFACT_AUDIT_2026-10-03.md), not a
# measurement of any vehicle. The stock map surface of the target cluster is a MISSING_INPUT; if it
# differs, change both lines below and calibrate the SafeAreas again. The source stays capped at 30 fps
# here, the audit's 40 fps ceiling and its 20 fps experiment concern the Omonob artifacts, not this path.
# No claim is made that the cluster accepts this size.
ALTSCREEN111_PORT=6031
ALTSCREEN111_TEE_PORT=19820
ALTSCREEN111_WIDTH=800
ALTSCREEN111_HEIGHT=480
ALTSCREEN111_FPS=30
# Direct-VC output pacing is intentionally separate from the source descriptor.
# The source remains capped at 30 fps unless a future source-side profile is
# deliberately changed; the direct output rate can be switched at runtime.
DIRECT_OUTPUT_FPS=30
DIRECT_PACE=1
DIRECT_PACE_BUFFER=3
ALTSCREEN111_AUTO_SHOW=0
ALTSCREEN111_URL=maps:/car/instrumentcluster
