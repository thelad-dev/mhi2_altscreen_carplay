# MIBR platform defaults: VW MU1367 / AID 12.3 candidate, 800x480 cockpit stream. <capability>=<value>
# Evidence: SOURCE only. [Unverifiziert] No calibration photo, DMDT value or vehicle trace exists for this size;
# 800x480 is Prior Art (OneB1t baseline, Omonob 791), not a measurement. The rectangles below are derived, not
# scaled from the 1010x376 reference, and make no claim about the real cluster layout. Calibrate on the vehicle
# (menu or calibration clip); a menu choice and a stored value take precedence over this file.
# Derivation (same rules as alt111_geometry.h, both must stay equal, see modules/carplay/source/altscreen111-gen2/tests/test_gen2_geometry.c):
#   1. [Spekulation] OEM top status line and bottom lane bar keep their absolute pixel height: the measured
#      58 px top / 70 px bottom of the 1010x376 reference, rounded outwards to the 16 px H.264 macroblock grid
#      (800 = 50 x 16, 480 = 30 x 16) -> top 64, bottom 80, band height 336. Outward rounding only shrinks the area.
#   2. The center band keeps its absolute 256 px width and is centered: x = (800 - 256) / 2 = 272.
#   3. Nesting center in voll in wide in canvas; every rectangle passes the load checks (w >= 100, h >= 60).
safe_voll=0,64,800,336
safe_wide=0,0,800,480
safe_center=272,64,256,336
# Input mapping keys (key.*, zoom.*) are intentionally absent: the MU1367 steering-wheel codes are not known
# (MISSING_INPUT), so the compiled defaults stay in force.
